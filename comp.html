function toast(m){const t=$('tt');t.firstElementChild.textContent=m;t.classList.add('on');clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove('on'),1800)}
function go(n){const s=G[g].s;if(n<0||n>s.length)return;i=n;draw()}
function draw(){const s=G[g].s,tot=s.length;$('pg').style.width=(i/tot*100)+'%';
 $('pv').disabled=i==0;$('nx').textContent=i>=tot?(tg?'إغلاق ✖':'من الأول ↺'):'التالي ←';
 if(i>=tot){$('v').innerHTML='<div class="done"><b>🎉</b><h2>خلّصت الدليل</h2><p class="d">لو علقت في أي خطوة، ابعت لنا لقطة شاشة من اللي ظاهر عندك.</p></div>';return}
 const st=s[i];let ph='';
 if(st.p){left=st.multi?st.p.filter(x=>x[3]&&x[0]=='sw').length:1;
  ph=`<div class="ask">دوس على الجزء المضيء في الشاشة 👇</div><div class="phone" id="ph"><div class="sr">${st.p.map(el).join('')}</div></div>`}
 $('v').innerHTML=`<div class="cnt">الخطوة ${nd(i+1)} من ${nd(tot)}</div><h2>${st.t}</h2><div class="d">${st.d}</div>${ph}`;
 scrollTo({top:0});
 const phn=$('ph');if(!phn)return;
 phn.onclick=e=>{const h=e.target.closest('[data-h]');
  if(!h){phn.classList.remove('sh');void phn.offsetWidth;phn.classList.add('sh');toast('دوس على الجزء المضيء 👆');return}
  const sw=h.querySelector('.sw');if(sw)sw.classList.add('on');h.classList.remove('hot');h.removeAttribute('data-h');
  if(--left>0){toast('تمام ✅ كمّل الباقي');return}
  toast('تمام ✅');setTimeout(()=>go(i+1),450)}}
function tabs(){$('tabs').innerHTML=Object.keys(G).map(k=>`<button class="${k==g?'on':''}" data-k="${k}">${G[k].n}</button>`).join('')}
$('tabs').onclick=e=>{const k=e.target.dataset.k;if(k&&k!=g){g=k;i=0;tabs();draw()}};
$('nx').onclick=()=>{if(i>=G[g].s.length){tg?tg.close():go(0)}else go(i+1)};$('pv').onclick=()=>go(i-1);
tabs();draw();
</script></body></html>
