<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صفحة التاجر</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f3f1ec;--card:#fff;--line:#e6e2d8;--tx:#16181d;--mut:#6f7480;--acc:#2563eb;--gold:#c98a0a;--gold2:#f2c14e;--goldbg:#fff6df;--ok:#15803d;--okbg:#e3f6ea;--chip:#f1efe9;--hero1:#1b2440;--hero2:#2c3a6b;--shadow:0 6px 18px rgba(20,24,40,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0d0f15;--card:#171a23;--line:#2a2f3d;--tx:#f1f2f6;--mut:#98a1b4;--acc:#6aa0ff;--gold:#f5b02a;--gold2:#ffd77a;--goldbg:#2a2210;--ok:#4abe64;--okbg:#12301c;--chip:#222634;--hero1:#10162b;--hero2:#222f5c;--shadow:0 6px 18px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-weight:700;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.top{width:max-content;margin:0 auto 8px;padding:4px 18px;border-radius:99px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3a2600;font-size:14px;letter-spacing:2px;box-shadow:var(--shadow)}

/* ---------- البطاقة الرئيسية: يمين = النجوم | نص = الهوية | شمال = توزيع النجوم ---------- */
.hero{position:relative;border-radius:22px;padding:2px;background:linear-gradient(135deg,var(--gold2),var(--gold) 40%,#8a5a00 60%,var(--gold2));box-shadow:var(--shadow);margin-bottom:10px}
.hero-in{position:relative;overflow:hidden;border-radius:20px;padding:30px 10px 26px;color:#fff;
  background:
   radial-gradient(circle at 15% 0%,rgba(242,193,78,.28),transparent 45%),
   radial-gradient(circle at 90% 100%,rgba(106,160,255,.25),transparent 45%),
   repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px),
   linear-gradient(160deg,var(--hero1),var(--hero2))}
.corner{position:absolute;width:38px;height:38px;opacity:.9;pointer-events:none}
.corner.tl{top:5px;left:5px}.corner.tr{top:5px;right:5px;transform:scaleX(-1)}
.corner.bl{bottom:5px;left:5px;transform:scaleY(-1)}.corner.br{bottom:5px;right:5px;transform:scale(-1,-1)}
.cols{display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;gap:0}
.col{padding:0 6px;min-width:0}
.col.mid{text-align:center;border-inline:1px solid rgba(242,193,78,.35)}
.col.rtc{text-align:center}
.ring{width:78px;height:78px;margin:0 auto 7px;border-radius:50%;padding:3px;background:conic-gradient(var(--gold2),var(--gold),#8a5a00,var(--gold2));box-shadow:0 0 0 3px rgba(242,193,78,.18),0 6px 16px rgba(0,0,0,.35)}
.av{width:100%;height:100%;border-radius:50%;background:var(--hero1);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--gold2);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:auto}
.tname{font-size:15px;margin:0;line-height:1.35;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tuser{font-size:12px;margin:3px 0 0;color:var(--gold2);direction:ltr;unicode-bidi:plaintext;word-break:break-all}
.tid{font-size:11px;margin:4px 0 0;color:rgba(255,255,255,.75);direction:ltr;letter-spacing:.3px}
.badges{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.badge{font-size:10px;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22)}
.badge.v{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3a2600;border-color:transparent}
.badge.i{direction:ltr}
.big{direction:ltr;font-size:36px;line-height:1;margin:0;color:var(--gold2)}
.big small{font-size:13px;color:rgba(255,255,255,.6)}
.stars{display:flex;gap:1px;justify-content:center;direction:ltr;margin-top:6px}
.stars svg{width:15px;height:15px}
.cnt{font-size:12px;margin:6px 0 0;color:rgba(255,255,255,.85)}
.cnt b{color:var(--gold2);font-size:15px}
.drow{display:flex;align-items:center;gap:5px;font-size:11px;margin:4px 0;direction:ltr;color:rgba(255,255,255,.9)}
.drow .l{width:22px;text-align:left;color:var(--gold2);white-space:nowrap}
.drow .bar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
.drow .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.drow .n{width:22px;text-align:right}
.dtitle{font-size:10px;color:rgba(255,255,255,.6);margin:0 0 3px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}

/* ---------- بطاقة المقيِّم ---------- */
.rvh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rvh h3{margin:0;font-size:14px}
.pg{font-size:12px;color:var(--mut)}
.who2{display:flex;align-items:center;gap:10px}
.rav{width:42px;height:42px;flex:none;border-radius:50%;background:var(--goldbg);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid var(--line)}
.rby{font-size:11px;color:var(--mut);margin:0}
/* اليوزر: ظاهر بس — مش بيتنسخ ومش بيتضغط عليه */
.ru{margin:2px 0 0;font-size:14px;color:var(--acc);direction:ltr;text-align:right;
  pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:default;text-decoration:none}
.rs{margin-top:10px;color:var(--gold);font-size:16px;letter-spacing:2px;direction:ltr;text-align:right}
.rt{margin:6px 0 0;font-size:14px;line-height:1.7;word-break:break-word;background:var(--chip);border-radius:12px;padding:10px 12px;font-weight:600}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.more{display:block;width:100%;margin-top:8px;background:none;border:0;min-height:30px;color:var(--acc);font-size:12px}

/* ---------- الأزرار ---------- */
button{font:inherit;font-weight:700;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer}
button:active{transform:scale(.98)}
button[disabled]{opacity:.35;cursor:default}
button.p{background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:transparent;color:#3a2600}
button.b{background:var(--acc);border-color:var(--acc);color:#fff}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .wide{grid-column:1/-1}
.note{text-align:center;color:var(--mut);font-size:11px;margin:10px 0 0}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.noselect,.noselect *{-webkit-user-select:none;user-select:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
  var NS = "http://www.w3.org/2000/svg";

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function svg(tag, attrs){
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  // نجمة بتتملي بنسبة fraction (0..1) عشان 4.3 تبان صح
  var STAR = "M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.3 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z";
  var gid = 0;
  function starSvg(fraction){
    var id = "g" + (++gid);
    var s = svg("svg", {viewBox: "0 0 24 24"});
    var defs = svg("defs", {});
    var lg = svg("linearGradient", {id: id, x1: "0", x2: "1", y1: "0", y2: "0"});
    var pct = Math.round(fraction * 100) + "%";
    lg.appendChild(svg("stop", {offset: pct, "stop-color": "#f2c14e"}));
    lg.appendChild(svg("stop", {offset: pct, "stop-color": "#d9d5c8", "stop-opacity": "0.55"}));
    defs.appendChild(lg); s.appendChild(defs);
    s.appendChild(svg("path", {d: STAR, fill: "url(#" + id + ")", stroke: "#c98a0a", "stroke-width": "0.8", "stroke-linejoin": "round"}));
    return s;
  }
  function corner(cls){
    var s = svg("svg", {viewBox: "0 0 46 46", "class": "corner " + cls});
    s.appendChild(svg("path", {d: "M3 43V14C3 7.4 7.4 3 14 3h29", fill: "none", stroke: "#f2c14e", "stroke-width": "1.6", "stroke-linecap": "round"}));
    s.appendChild(svg("path", {d: "M9 43V18c0-5 4-9 9-9h25", fill: "none", stroke: "#f2c14e", "stroke-width": ".8", opacity: ".6"}));
    s.appendChild(svg("circle", {cx: "14", cy: "14", r: "2.4", fill: "#f2c14e"}));
    return s;
  }
  function decode(){
    var q = new URLSearchParams(location.search).get("d");
    if (!q) return null;
    try {
      q = q.replace(/-/g, "+").replace(/_/g, "/");
      while (q.length % 4) q += "=";
      var bin = atob(q), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return JSON.parse(new TextDecoder("utf-8").decode(bytes));
    } catch (e) { return null; }
  }
  function openTg(url){
    if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank");
  }

  var app = document.getElementById("app");
  var d = decode();
  if (!d || !d.u) {
    app.appendChild(el("div", "card empty", "افتح الصفحة من زر «🪪 صفحتي» داخل البوت."));
    return;
  }
  var botLink = function(kind){ return d.b ? "https://t.me/" + d.b + "?start=" + kind + "_" + d.u : "https://t.me"; };
  var avg = (typeof d.a === "number") ? d.a : null;
  var cnt = d.c || [0,0,0,0,0];
  var rated = cnt.reduce(function(a, b){ return a + b; }, 0);
  var shownName = (d.nm || "").trim();

  // منع النسخ وقائمة الضغط المطوّل على أي عنصر معلّم noselect
  document.addEventListener("contextmenu", function(e){ if (e.target.closest && e.target.closest(".noselect")) e.preventDefault(); });
  document.addEventListener("copy", function(e){ if (e.target && e.target.closest && e.target.closest(".noselect")) e.preventDefault(); });

  app.appendChild(el("p", "top", "💎 VIP"));

  // ================= 1+2) البطاقة الرئيسية: يمين النجوم | نص الهوية | شمال التوزيع =================
  var hero = el("div", "hero");
  var hin = el("div", "hero-in");
  ["tl", "tr", "bl", "br"].forEach(function(c){ hin.appendChild(corner(c)); });
  var cols = el("div", "cols");

  // --- اليمين: المتوسط والنجوم وعدد التقييمات
  var cr = el("div", "col rtc");
  var big = el("p", "big", avg === null ? "—" : avg.toFixed(1));
  if (avg !== null) big.appendChild(el("small", "", "/5"));
  cr.appendChild(big);
  var st = el("div", "stars");
  for (var i = 0; i < 5; i++) st.appendChild(starSvg(avg === null ? 0 : Math.max(0, Math.min(1, avg - i))));
  cr.appendChild(st);
  var cn = el("p", "cnt");
  if (d.n) { cn.appendChild(el("b", "", String(d.n))); cn.appendChild(document.createTextNode(" تقييم")); }
  else cn.textContent = "لسه مفيش تقييمات";
  cr.appendChild(cn);

  // --- النص: الصورة + الاسم + اليوزر
  var cm = el("div", "col mid");
  var ring = el("div", "ring");
  var av = el("div", "av", ((shownName || d.u).charAt(0) || "?").toUpperCase());
  // الصورة: الأوضح تكسب → (1) نسخة كاملة من سيرفر البوت  (2) صورة تليجرام العامة  (3) المصغّرة اللي جوه الرابط
  var rank = 0;
  function usePhoto(src, rk){
    var im = new Image(); im.alt = "";
    im.onload = function(){ if (rk > rank) { rank = rk; av.textContent = ""; av.appendChild(im); } };
    im.src = src;
  }
  var tq = new URLSearchParams(location.search).get("p");
  if (tq) {
    tq = tq.replace(/-/g, "+").replace(/_/g, "/"); while (tq.length % 4) tq += "=";
    usePhoto("data:image/webp;base64," + tq, 1);
  }
  usePhoto("https://t.me/i/userpic/320/" + encodeURIComponent(d.u) + ".jpg", 2);
  var hb = new URLSearchParams(location.search).get("h");   // دومين البوت (Railway) لتقديم صورة واضحة
  if (hb && /^https:\/\//.test(hb)) usePhoto(hb.replace(/\/$/, "") + "/photo/" + encodeURIComponent(d.u) + ".jpg?v=" + Math.floor(Date.now() / 3600000), 3);
  ring.appendChild(av); cm.appendChild(ring);
  cm.appendChild(el("p", "tname", shownName || ("@" + d.u)));
  cm.appendChild(el("p", "tuser", "@" + d.u));
  if (d.id) cm.appendChild(el("p", "tid", "ID: " + d.id));

  // --- الشمال: كام شخص قيّم 5 نجوم، 4 نجوم... إلخ
  var cl = el("div", "col");
  var mx = Math.max.apply(null, cnt) || 1;
  cl.appendChild(el("p", "dtitle", "عدد المقيّمين"));
  for (var k = 0; k < 5; k++) {
    var r = el("div", "drow");
    r.appendChild(el("span", "l", (5 - k) + " ★"));
    var bar = el("div", "bar"), fill = el("i"); fill.style.width = Math.round(cnt[k] * 100 / mx) + "%"; bar.appendChild(fill);
    r.appendChild(bar); r.appendChild(el("span", "n", String(cnt[k])));
    cl.appendChild(r);
  }

  cols.appendChild(cr); cols.appendChild(cm); cols.appendChild(cl);
  hin.appendChild(cols);
  hero.appendChild(hin); app.appendChild(hero);

  // ================= 3) بطاقة المقيِّم + تقييمه =================
  var revs = d.r || [];
  if (revs.length) {
    var vc = el("div", "card");
    var rh = el("div", "rvh"); rh.appendChild(el("h3", "", "آراء العملاء"));
    var pg = el("span", "pg"); rh.appendChild(pg); vc.appendChild(rh);
    var body = el("div", ""); vc.appendChild(body);
    var nav = el("div", "nav");
    var prev = el("button", "", "السابق ›"), next = el("button", "", "‹ التالي");
    nav.appendChild(prev); nav.appendChild(next);
    var idx = 0;
    function show(){
      var x = revs[idx];
      body.textContent = "";
      var w = el("div", "who2");
      var uname = x[2] ? String(x[2]).replace(/^@/, "") : "";
      w.appendChild(el("div", "rav", uname ? uname.charAt(0).toUpperCase() : "👤"));
      var wi = el("div", "");
      wi.appendChild(el("p", "rby", "المقيِّم"));
      // فاصل غير مرئي بعد @ + noselect: يظهر بس، لا بيتنسخ ولا بيتحوّل لرابط
      var u = el("p", "ru noselect", uname ? "@\u200c" + uname : "عميل (بدون يوزر)");
      u.setAttribute("aria-label", uname ? "مقيِّم" : "عميل");
      u.addEventListener("click", function(e){ e.preventDefault(); e.stopPropagation(); });
      wi.appendChild(u); w.appendChild(wi); body.appendChild(w);
      if (x[0]) body.appendChild(el("div", "rs", "★".repeat(x[0]) + "☆".repeat(5 - x[0])));
      body.appendChild(el("p", "rt", x[1] || "—"));
      pg.textContent = (idx + 1) + " / " + revs.length;
      prev.disabled = idx === 0; next.disabled = idx === revs.length - 1;
    }
    prev.onclick = function(){ if (idx > 0) { idx--; show(); } };
    next.onclick = function(){ if (idx < revs.length - 1) { idx++; show(); } };
    if (revs.length > 1) vc.appendChild(nav);
    if ((d.n || 0) > revs.length) {
      var more = el("button", "more", "عرض كل الآراء (" + d.n + ") في البوت");
      more.onclick = function(){ openTg(botLink("tp")); };
      vc.appendChild(more);
    }
    show();
    app.appendChild(vc);
  }

  // ================= 4) الأزرار =================
  var acts = el("div", "acts");
  var rate = el("button", "p wide", "⭐ تقييم التاجر");
  rate.onclick = function(){ openTg(botLink("tr")); };
  var share = el("button", "b", "📤 مشاركة");
  share.onclick = function(){
    var who2 = shownName || ("@" + d.u);
    var text = "⭐ تقييمات " + who2 + (avg === null ? "" : " — " + avg.toFixed(1) + "/5") + " من " + (d.n || 0) +
      " تقييم. اتعامل معاه؟ قيّمه من البوت 👇";
    openTg("https://t.me/share/url?url=" + encodeURIComponent(botLink("tp")) + "&text=" + encodeURIComponent(text));
  };
  var cancel = el("button", "", "✖ إلغاء");
  cancel.onclick = function(){ if (tg) tg.close(); else history.back(); };
  var home = el("button", "wide", "🏠 العودة لخدمات البوت");
  home.onclick = function(){   // يفتح البوت على القائمة الرئيسية ويقفل الميني آب
    if (d.b) openTg("https://t.me/" + d.b + "?start=home");
    if (tg) setTimeout(function(){ try { tg.close(); } catch(e){} }, 250);
  };
  acts.appendChild(rate); acts.appendChild(share); acts.appendChild(cancel); acts.appendChild(home);
  app.appendChild(acts);
  app.appendChild(el("p", "note", "التقييمات من العملاء ومحدش بيضمن التعامل"));
})();
</script>
</body>
</html>
