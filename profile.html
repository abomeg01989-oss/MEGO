<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صفحة التاجر</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--line:#e3e5ea;--tx:#15171c;--mut:#6b7280;--acc:#2563eb;--accbg:#e8f0fe;--ok:#15803d;--okbg:#e3f6ea;--gold:#d98a0b;--chip:#f1f2f5}
@media (prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#1a1d26;--line:#2d3240;--tx:#f0f2f7;--mut:#96a0b3;--acc:#6aa0ff;--accbg:#16264a;--ok:#4abe64;--okbg:#12301c;--gold:#f5b02a;--chip:#232735}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-weight:700;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin:0 2px 6px}
.id{display:flex;align-items:center;gap:10px}
.av{width:46px;height:46px;flex:none;border-radius:50%;background:var(--accbg);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:20px}
.who{min-width:0;flex:1}
.tname{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name{font-size:13px;color:var(--mut);margin:0;direction:ltr;text-align:right}
.badges{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 8px;border-radius:7px}
.b1{background:var(--okbg);color:var(--ok)}
.b2{background:var(--chip);color:var(--mut);direction:ltr}
.sum{display:flex;align-items:center;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.big{font-size:38px;line-height:1;margin:0}
.stars{display:flex;gap:2px}
.stars svg{width:16px;height:16px}
.sub{font-size:11px;color:var(--mut);margin:3px 0 0}
.dist{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);margin:2px 0}
.row span:first-child{width:8px}
.row span:last-child{width:18px;text-align:left}
.bar{flex:1;height:5px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.rvh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rvh h3{margin:0;font-size:14px}
.pg{font-size:12px;color:var(--mut)}
.rvb{min-height:78px}
.rs{color:var(--gold);font-size:13px}
.rt{margin:3px 0 0;font-size:14px;line-height:1.6;word-break:break-word}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.more{display:block;width:100%;margin-top:6px;background:none;border:0;min-height:30px;color:var(--acc);font-size:12px}
button{font:inherit;font-weight:700;min-height:40px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer}
button[disabled]{opacity:.4;cursor:default}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{text-align:center;color:var(--mut);font-size:11px;margin:6px 0 0}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function starSvg(on){
    var ns = "http://www.w3.org/2000/svg";
    var s = document.createElementNS(ns, "svg"); s.setAttribute("viewBox", "0 0 24 24");
    var p = document.createElementNS(ns, "path");
    p.setAttribute("d", "M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.3 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z");
    p.setAttribute("fill", on ? "var(--gold)" : "var(--chip)");
    p.setAttribute("stroke", on ? "var(--gold)" : "var(--line)");
    p.setAttribute("stroke-width", "1");
    s.appendChild(p); return s;
  }
  function decode(){
    var q = new URLSearchParams(location.search).get("d");
    if (!q) return null;
    try {
      q = q.replace(/-/g, "+").replace(/_/g, "/");
      while (q.length % 4) q += "=";
      var bin = atob(q), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return JSON.parse(new TextDecoder("utf-8").decode(bytes));
    } catch (e) { return null; }
  }
  function openTg(url){
    if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank");
  }

  var app = document.getElementById("app");
  var d = decode();
  if (!d || !d.u) {
    app.appendChild(el("div", "card empty", "افتح الصفحة من زر «🪪 صفحتي» داخل البوت."));
    return;
  }
  var botLink = function(kind){ return d.b ? "https://t.me/" + d.b + "?start=" + kind + "_" + d.u : "https://t.me"; };
  var avg = (typeof d.a === "number") ? d.a : null;
  var cnt = d.c || [0,0,0,0,0];
  var rated = cnt.reduce(function(a, b){ return a + b; }, 0);
  var shownName = (d.nm || "").trim();

  // ---------- البروفايل (ثابت): هوية + متوسط + توزيع النجوم
  var top = el("div", "top"); top.appendChild(el("span", "", "RADAR | VIP")); app.appendChild(top);
  var c = el("div", "card");
  var idr = el("div", "id");
  idr.appendChild(el("div", "av", ((shownName || d.u).charAt(0) || "?").toUpperCase()));
  var who = el("div", "who");
  if (shownName) who.appendChild(el("p", "tname", shownName));
  who.appendChild(el("p", "name", "@" + d.u));
  var bd = el("div", "badges");
  if (d.v) bd.appendChild(el("span", "badge b1", "مشترك VIP"));
  if (d.id) bd.appendChild(el("span", "badge b2", "ID: " + d.id));
  if (bd.childNodes.length) who.appendChild(bd);
  idr.appendChild(who); c.appendChild(idr);

  var sum = el("div", "sum");
  var left = el("div", "");
  left.appendChild(el("p", "big", avg === null ? "—" : avg.toFixed(1)));
  var st = el("div", "stars"), full = Math.round(avg || 0);
  for (var i = 0; i < 5; i++) st.appendChild(starSvg(i < full));
  left.appendChild(st);
  var five = rated ? Math.round(cnt[0] * 100 / rated) + "% خمس نجوم" : "";
  left.appendChild(el("p", "sub", (d.n || 0) ? (d.n + " تقييم" + (five ? " • " + five : "")) : "لسه مفيش تقييمات"));
  sum.appendChild(left);
  if (rated) {
    var dist = el("div", "dist"), mx = Math.max.apply(null, cnt) || 1;
    for (var k = 0; k < 5; k++) {
      var r = el("div", "row");
      r.appendChild(el("span", "", String(5 - k)));
      var bar = el("div", "bar"), fill = el("i"); fill.style.width = Math.round(cnt[k] * 100 / mx) + "%"; bar.appendChild(fill);
      r.appendChild(bar); r.appendChild(el("span", "", String(cnt[k])));
      dist.appendChild(r);
    }
    sum.appendChild(dist);
  }
  c.appendChild(sum);
  app.appendChild(c);

  // ---------- التقييمات (اللي بتتغير): تقييم واحد في المرة + السابق/التالي
  var revs = d.r || [];
  if (revs.length) {
    var rc = el("div", "card");
    var rh = el("div", "rvh"); rh.appendChild(el("h3", "", "آراء العملاء"));
    var pg = el("span", "pg"); rh.appendChild(pg); rc.appendChild(rh);
    var body = el("div", "rvb"); rc.appendChild(body);
    var nav = el("div", "nav");
    var prev = el("button", "", "السابق ›"), next = el("button", "", "‹ التالي");
    nav.appendChild(prev); nav.appendChild(next);
    var idx = 0;
    function show(){
      var x = revs[idx];
      body.textContent = "";
      if (x[0]) body.appendChild(el("div", "rs", "★".repeat(x[0]) + "☆".repeat(5 - x[0])));
      body.appendChild(el("p", "rt", x[1] || ""));
      pg.textContent = (idx + 1) + " / " + revs.length;
      prev.disabled = idx === 0; next.disabled = idx === revs.length - 1;
    }
    prev.onclick = function(){ if (idx > 0) { idx--; show(); } };
    next.onclick = function(){ if (idx < revs.length - 1) { idx++; show(); } };
    if (revs.length > 1) rc.appendChild(nav); else { prev.disabled = next.disabled = true; }
    if ((d.n || 0) > revs.length) {
      var more = el("button", "more", "عرض كل الآراء (" + d.n + ") في البوت");
      more.onclick = function(){ openTg(botLink("tp")); };
      rc.appendChild(more);
    }
    show();
    app.appendChild(rc);
  }

  // ---------- الأزرار
  var acts = el("div", "acts");
  var rate = el("button", "p", "⭐ قيّم التاجر");
  rate.onclick = function(){ openTg(botLink("tr")); };
  var share = el("button", "", "📤 مشاركة");
  share.onclick = function(){
    var who2 = shownName || ("@" + d.u);
    var text = "⭐ تقييمات " + who2 + (avg === null ? "" : " — " + avg.toFixed(1) + "/5") + " من " + (d.n || 0) +
      " تقييم. اتعامل معاه؟ قيّمه من البوت 👇";
    openTg("https://t.me/share/url?url=" + encodeURIComponent(botLink("tp")) + "&text=" + encodeURIComponent(text));
  };
  var close = el("button", "", "إغلاق");
  close.onclick = function(){ if (tg) tg.close(); else history.back(); };
  var start = el("button", "", "🏠 ابدأ استخدام البوت");
  start.onclick = function(){   // يقفل الميني آب ويفتح البوت على /start → القائمة الرئيسية
    if (d.b) openTg("https://t.me/" + d.b + "?start=home"); else if (tg) tg.close();
  };
  acts.appendChild(rate); acts.appendChild(share); acts.appendChild(start); acts.appendChild(close);
  app.appendChild(acts);
  app.appendChild(el("p", "note", "موثّق من RADAR | VIP"));
})();
</script>
</body>
</html>
